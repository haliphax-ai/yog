name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  docker:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports: [5000:5000]
    steps:
      - uses: haliphax-ai/yog/.github@main
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: localhost:5000/yog:latest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: haliphax-ai/yog/.github@main
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: haliphax-ai/yog/.github@main
      - run: |
          sudo apt-get update -qq && \
            sudo apt-get install -yqq --no-install-recommends libfuse2t64
      - name: Install coverage provider
        run: |
          npm install --no-save \
            "@vitest/coverage-v8@$(node -p "require('./node_modules/vitest/package.json').version")"
      # The mount tag rides the package.json filter (npm test): the live
      # FUSE suite needs kernel mount privileges the hosted runner image
      # does not guarantee (20261122.9 lost them — EACCES through the
      # mounted path), and its own job (test:mount) covers it explicitly.
      - run: >-
          npx vitest run --silent=true
          --tagsFilter '!mount'
          --coverage.enabled
          --coverage.provider=v8
          --coverage.reporter=lcov
          --coverage.include='src/**'
          .
      - uses: qltysh/qlty-action/coverage@v2
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          oidc: true
          files: coverage/lcov.info

  depcruise:
    runs-on: ubuntu-latest
    steps:
      - uses: haliphax-ai/yog/.github@main
      - run: npm run depcruise

  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: haliphax-ai/yog/.github@main
      - name: oxlint
        run: npx oxlint .

  oxfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: haliphax-ai/yog/.github@main
      - name: oxfmt
        run: npx oxfmt --check --no-error-on-unmatched-pattern .
